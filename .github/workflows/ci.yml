name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare desktop and Android versions
        shell: python
        run: |
          import pathlib
          import re

          string_versions = {
              "desktop": ("desktop/src/flowclip/__init__.py", r'__version__\s*=\s*"([^"]+)"'),
              "Windows FileVersion": ("desktop/assets/version_info.txt", r"FileVersion',\s*u'([^']+)'"),
              "Windows ProductVersion": ("desktop/assets/version_info.txt", r"ProductVersion',\s*u'([^']+)'"),
              "Android": ("android/app/build.gradle", r'versionName\s+"([^"]+)"'),
          }
          versions = {}
          for name, (filename, pattern) in string_versions.items():
              text = pathlib.Path(filename).read_text(encoding="utf-8")
              match = re.search(pattern, text)
              if match is None:
                  raise SystemExit(f"Could not read {name} version from {filename}")
              versions[name] = match.group(1)
          print(versions)
          if len(set(versions.values())) != 1:
              raise SystemExit("Desktop, Windows resource, and Android versions must match")

          base = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:[-+].+)?", versions["desktop"])
          if base is None:
              raise SystemExit("Desktop version must start with MAJOR.MINOR.PATCH")
          expected_numeric = tuple(map(int, base.groups())) + (0,)
          resource = pathlib.Path("desktop/assets/version_info.txt").read_text(encoding="utf-8")
          for name in ("filevers", "prodvers"):
              match = re.search(
                  rf"{name}=\((\d+),\s*(\d+),\s*(\d+),\s*(\d+)\)",
                  resource,
              )
              actual = tuple(map(int, match.groups())) if match else None
              if actual != expected_numeric:
                  raise SystemExit(f"Windows {name} is {actual}; expected {expected_numeric}")

  desktop-tests:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-22.04
          - macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.in
            desktop/requirements-build.in
            desktop/requirements.txt
            desktop/requirements-build.txt

      - name: Install desktop dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r desktop/requirements-build.txt'

      - name: Check desktop dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q desktop/src desktop/tests

      - name: Run desktop unit tests
        run: python -m unittest discover -s desktop/tests -p "test_*.py"

  android:
    name: Android validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install required Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
