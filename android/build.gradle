plugins {
    id "com.android.application" version "9.3.1" apply false
}

def externalBuildRoot = providers.gradleProperty("flowclipBuildDir").orNull
if (externalBuildRoot != null && !externalBuildRoot.trim().isEmpty()) {
    layout.buildDirectory.set(file("${externalBuildRoot}/root"))
    subprojects {
        layout.buildDirectory.set(file("${externalBuildRoot}/${project.name}"))
    }
}
